name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          pip install pandas==2.2.2 numpy==1.26.4 scikit-learn==1.5.1 imbalanced-learn==0.12.3 pytest==8.3.2

      - name: Run tests
        run: python -m pytest tests/ -v